<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点击按钮，记录失误,AI复盘。</title>


/* 这里是 CSS，负责让网站变好看 */
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 整个页面背景 */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

   /* 大标题 */
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #a0a0c0;
    margin-bottom: 40px;
    letter-spacing: 2px;
  }

  /* 录音按钮 */
  #recordBtn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #4a4a6a, #3a3a5a);
    color: #d0d0f0;
    font-size: 48px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 32px rgba(80, 80, 200, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #recordBtn:hover { transform: scale(1.05); }
  #recordBtn:active { transform: scale(0.95); }

  #recordBtn.recording {
    background: linear-gradient(135deg, #cc3344, #aa2244);
    box-shadow: 0 8px 32px rgba(200, 50, 80, 0.4);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(200,50,80,0.4); }
    50% { box-shadow: 0 8px 48px rgba(200,50,80,0.7); }
  }

  /* 状态文字 */
  #status {
    margin-top: 24px;
    font-size: 14px;
    color: #707090;
    min-height: 24px;
  }

  /* 文字结果区 */
  #result {
    margin-top: 32px;
    width: 100%;
    max-width: 600px;
    min-height: 120px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px;
    font-size: 16px;
    line-height: 1.8;
    color: #d0d0e8;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #result:empty::before {
    content: "识别结果将显示在这里…";
    color: #444466;
  }

  /* 复制按钮 */
  #copyBtn {
    margin-top: 16px;
    padding: 8px 24px;
    background: #2a2a4a;
    border: 1px solid #3a3a5a;
    border-radius: 8px;
    color: #a0a0c0;
    font-size: 14px;
    cursor: pointer;
    display: none;
  }
  #copyBtn:hover { background: #3a3a5a; }

  /* 计时器 */
  #timer {
    margin-top: 12px;
    font-size: 14px;
    color: #6060a0;
    font-variant-numeric: tabular-nums;
    display: none;
  }
</style>
</head>
<body>

<h1>🎙 语音转文字</h1>

<button id="recordBtn" title="点击开始录音">🎙</button>
<div id="timer"></div>
<div id="status">点击按钮开始录音</div>
<div id="result"></div>
<button id="copyBtn">📋 复制文字</button>

<script>
let isRecording = false;
let recognition = null;
let timerInterval = null;
let seconds = 0;

const btn = document.getElementById('recordBtn');
const status = document.getElementById('status');
const result = document.getElementById('result');
const copyBtn = document.getElementById('copyBtn');
const timerEl = document.getElementById('timer');

// ===== 检查浏览器支持 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  status.textContent = '❌ 当前浏览器不支持语音识别，请使用 Chrome 或 Edge';
  btn.disabled = true;
}

// ===== 初始化语音识别 =====
function initRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';       // 中文识别
  recognition.interimResults = true;   // 实时显示中间结果
  recognition.continuous = true;      // 持续识别
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    status.textContent = '🎙 正在录音，请说话…';
    timerEl.style.display = 'block';
    startTimer();
  };

  recognition.onresult = (event) => {
    let finalText = '';
    let interimText = '';
    for (let i = 0; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalText += text;
      } else {
        interimText += text;
      }
    }
    // 显示：最终结果 + 灰色中间结果
    result.innerHTML = escapeHtml(finalText) +
      (interimText ? `<span style="color:#555577">${escapeHtml(interimText)}</span>` : '');
    if (finalText) copyBtn.style.display = 'inline-block';
  };

  recognition.onerror = (event) => {
    console.error('语音识别错误:', event.error);
    if (event.error === 'not-allowed') {
      status.textContent = '❌ 请允许浏览器使用麦克风权限';
    } else if (event.error === 'no-speech') {
      status.textContent = '🎙 未检测到语音，请继续说话…';
    } else if (event.error === 'network') {
      status.textContent = '❌ 网络错误，请检查网络连接';
    } else {
      status.textContent = '⚠️ 识别错误：' + event.error;
    }
  };

  recognition.onend = () => {
    // 如果是正在录音状态却意外结束，尝试重启
    if (isRecording) {
      try { recognition.start(); } catch(e) {}
    }
  };
}

function startTimer() {
  seconds = 0;
  updateTimer();
  timerInterval = setInterval(() => { seconds++; updateTimer(); }, 1000);
}

function updateTimer() {
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  timerEl.textContent = m + ':' + s;
}

function stopTimer() {
  clearInterval(timerInterval);
  timerEl.style.display = 'none';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 按钮点击 =====
btn.addEventListener('click', () => {
  if (!isRecording) {
    startRecording();
  } else {
    stopRecording();
  }
});

function startRecording() {
  if (!recognition) initRecognition();

  isRecording = true;
  btn.classList.add('recording');
  btn.textContent = '⏹';
  result.textContent = '';
  copyBtn.style.display = 'none';

  try {
    recognition.start();
  } catch(e) {
    // 已经在运行了
    console.warn('recognition.start() 异常:', e);
  }
}

function stopRecording() {
  isRecording = false;
  btn.classList.remove('recording');
  btn.textContent = '🎙';
  status.textContent = '✅ 录音结束，结果已显示';
  stopTimer();

  try { recognition.stop(); } catch(e) {}
}

// ===== 复制按钮 =====
copyBtn.addEventListener('click', () => {
  const text = result.textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const orig = copyBtn.textContent;
    copyBtn.textContent = '✅ 已复制';
    setTimeout(() => { copyBtn.textContent = orig; }, 1500);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    copyBtn.textContent = '✅ 已复制';
    setTimeout(() => { copyBtn.textContent = '📋 复制文字'; }, 1500);
  });
});
</script>

</body>
</html>
