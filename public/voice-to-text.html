<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 复盘 - 记录失误，持续进化</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 20px 48px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(10,10,10,0.88);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav-logo { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; color: #fff; text-decoration: none; }
  .nav-logo span { color: #7F77DD; }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a { font-size: 14px; color: rgba(255,255,255,0.6); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: #fff; }
  .nav-links a.active { color: #7F77DD; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    padding-top: 80px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #a0a0c0;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  /* ── 主录音区 ── */
  .record-section {
    width: 100%;
    max-width: 600px;
    text-align: center;
  }

  .record-hint {
    font-size: 14px;
    color: #7070a0;
    margin-bottom: 24px;
    line-height: 1.7;
  }

  /* 大录音按钮 */
  .big-record-btn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 3px solid #3a3a5a;
    background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
    color: #d0d0f0;
    font-size: 36px;
    cursor: pointer;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 24px rgba(80, 80, 200, 0.15);
  }
  .big-record-btn:hover {
    transform: scale(1.06);
    border-color: #5a5a8a;
    box-shadow: 0 6px 32px rgba(80, 80, 200, 0.25);
  }
  .big-record-btn:active { transform: scale(0.96); }
  .big-record-btn.recording {
    border-color: #cc3344;
    background: linear-gradient(135deg, #442233, #331122);
    box-shadow: 0 4px 36px rgba(200, 50, 80, 0.4);
    animation: pulse-big 1.5s infinite;
  }

  @keyframes pulse-big {
    0%, 100% { box-shadow: 0 4px 36px rgba(200,50,80,0.4); }
    50% { box-shadow: 0 4px 52px rgba(200,50,80,0.7); }
  }

  .record-status {
    margin-top: 16px;
    font-size: 14px;
    color: #6060a0;
    min-height: 24px;
  }

  /* 实时语音转写区 */
  .transcript-box {
    margin-top: 16px;
    width: 100%;
    min-height: 80px;
    max-height: 200px;
    overflow-y: auto;
    background: #161628;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    line-height: 1.8;
    color: #b0b0d0;
    text-align: left;
    display: none;
    word-break: break-word;
  }
  .transcript-box.active { display: block; }
  .transcript-box .interim {
    color: #505070;
  }

  /* ── 提示卡片区域 ── */
  .tips-section {
    margin-top: 28px;
    width: 100%;
    max-width: 600px;
  }

  .tips-title {
    font-size: 14px;
    color: #6060a0;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }

  .tip-cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tip-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #161628;
    border: 1px solid #222240;
    border-radius: 10px;
    padding: 12px 16px;
    transition: all 0.3s;
  }

  .tip-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #222244;
    color: #7070a0;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .tip-text {
    font-size: 14px;
    color: #8080a8;
    line-height: 1.5;
  }

  /* ── 分析按钮 ── */
  #analyzeBtn {
    margin-top: 24px;
    width: 100%;
    max-width: 600px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #3a6a4a, #2a5a3a);
    color: #d0f0d0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  #analyzeBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(60,140,80,0.3); }
  #analyzeBtn:active { transform: translateY(0); }
  #analyzeBtn:disabled {
    background: #2a2a3a;
    color: #505060;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* 再来一条按钮 */
  #resetBtn {
    margin-top: 16px;
    width: 100%;
    max-width: 600px;
    padding: 14px;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    background: transparent;
    color: #7070a0;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    display: none;
  }
  #resetBtn:hover { border-color: #4a4a6a; color: #a0a0c0; }

  /* AI 分析结果区 */
  #analysis {
    margin-top: 32px;
    width: 100%;
    max-width: 600px;
    min-height: 120px;
    background: #1a1a2e;
    border: 1px solid #2a4a3a;
    border-radius: 12px;
    padding: 20px;
    font-size: 14px;
    line-height: 1.8;
    color: #d0d0e8;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }

  .card-label {
    font-size: 13px;
    color: #6060a0;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a2a4a;
  }

  /* 加载动画 */
  .loading {
    display: inline-block;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* 录音时间指示 */
  .record-timer {
    margin-top: 8px;
    font-size: 22px;
    font-weight: 300;
    color: #cc5566;
    font-variant-numeric: tabular-nums;
    display: none;
  }
  .record-timer.active { display: block; }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">Life<span>OS</span></a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="voice-to-text.html" class="active">开始体验</a>
    <a href="prism.html">复盘棱镜</a>
  </div>
</nav>

<h1>AI 复盘</h1>

<!-- 主录音区 -->
<div class="record-section" id="recordSection">
  <div class="record-hint">
    点击下方按钮，一次性说出你的失误经历。<br>
    参考右边的提示，尽量覆盖所有维度。
  </div>

  <button class="big-record-btn" id="bigRecBtn" onclick="toggleRecording()">🎙</button>

  <div class="record-timer" id="recordTimer">00:00</div>
  <div class="record-status" id="recordStatus"></div>

  <!-- 实时语音转写 -->
  <div class="transcript-box" id="transcriptBox"></div>
</div>

<!-- 提示卡片：5 个关键维度 -->
<div class="tips-section">
  <div class="tips-title">试试在录音中覆盖这些维度 👇</div>
  <div class="tip-cards">
    <div class="tip-card">
      <div class="tip-num">1</div>
      <div class="tip-text">发生了什么事？</div>
    </div>
    <div class="tip-card">
      <div class="tip-num">2</div>
      <div class="tip-text">当时做了什么？</div>
    </div>
    <div class="tip-card">
      <div class="tip-num">3</div>
      <div class="tip-text">当时是怎么想的？</div>
    </div>
    <div class="tip-card">
      <div class="tip-num">4</div>
      <div class="tip-text">导致了什么后果？</div>
    </div>
    <div class="tip-card">
      <div class="tip-num">5</div>
      <div class="tip-text">以后打算怎么做？</div>
    </div>
  </div>
</div>

<button id="analyzeBtn" onclick="submitForAnalysis()" disabled>开始 AI 分析</button>
<button id="resetBtn" onclick="resetAll()">再来一条</button>

<div id="analysis">
  <div class="card-label">AI 分析结果</div>
  <div id="analysis-content"></div>
</div>

<div id="status"></div>

<script>
// ===== 全局状态 =====
let isRecording = false;
let recognition = null;
let finalTranscript = '';
let timerInterval = null;
let recordSeconds = 0;

const bigRecBtn = document.getElementById('bigRecBtn');
const recordStatus = document.getElementById('recordStatus');
const recordTimer = document.getElementById('recordTimer');
const transcriptBox = document.getElementById('transcriptBox');
const analyzeBtn = document.getElementById('analyzeBtn');
const status = document.getElementById('status');
const analysisDiv = document.getElementById('analysis');
const analysisContent = document.getElementById('analysis-content');
const recordSection = document.getElementById('recordSection');

// ===== 检查浏览器支持 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  recordStatus.textContent = '当前浏览器不支持语音识别，请使用 Chrome 或 Edge';
  bigRecBtn.disabled = true;
}

// ===== 初始化语音识别 =====
function initRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    let interimText = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += text;
      } else {
        interimText += text;
      }
    }

    // 实时显示转写结果
    transcriptBox.innerHTML = escapeHtml(finalTranscript) +
      (interimText ? '<span class="interim">' + escapeHtml(interimText) + '</span>' : '');
  };

  recognition.onerror = (event) => {
    console.error('语音识别错误:', event.error);
    if (event.error === 'not-allowed') {
      recordStatus.textContent = '请允许浏览器使用麦克风权限';
    } else if (event.error === 'no-speech') {
      // 静默处理
    } else if (event.error === 'network') {
      recordStatus.textContent = '网络错误，请检查网络连接';
    }
  };

  recognition.onend = () => {
    if (isRecording) {
      // 录音中自动断开，重新启动
      try { recognition.start(); } catch(e) {}
    } else {
      // 用户手动停止 → 结束录音
      stopRecordingUI();
    }
  };
}

// ===== 录音按钮点击 =====
function toggleRecording() {
  if (isRecording) {
    // 停止录音
    isRecording = false;
    try { recognition.stop(); } catch(e) {}
    // onend 会调用 stopRecordingUI()
  } else {
    // 开始录音
    if (!recognition) initRecognition();

    isRecording = true;
    finalTranscript = '';
    bigRecBtn.classList.add('recording');
    bigRecBtn.textContent = '⏹';
    transcriptBox.classList.add('active');
    transcriptBox.innerHTML = '';
    recordStatus.textContent = '正在录音，再次点击停止…';

    // 计时器
    recordSeconds = 0;
    recordTimer.classList.add('active');
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      recordSeconds++;
      updateTimerDisplay();
    }, 1000);

    try {
      recognition.start();
    } catch(e) {
      console.warn('recognition.start() 异常:', e);
    }
  }
}

function stopRecordingUI() {
  bigRecBtn.classList.remove('recording');
  bigRecBtn.textContent = '🎙';
  clearInterval(timerInterval);
  recordTimer.classList.remove('active');

  const text = finalTranscript.trim();
  if (text) {
    recordStatus.textContent = '录音完成，可以点击「开始 AI 分析」';
    analyzeBtn.disabled = false;
  } else {
    recordStatus.textContent = '未检测到语音内容，请重新录音';
    analyzeBtn.disabled = true;
  }
}

function updateTimerDisplay() {
  const min = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
  const sec = String(recordSeconds % 60).padStart(2, '0');
  recordTimer.textContent = min + ':' + sec;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 开始 AI 分析 =====
async function submitForAnalysis() {
  const rawText = finalTranscript.trim();
  if (!rawText) return;

  status.textContent = '正在保存并发送给 AI 分析…';
  analysisDiv.style.display = 'block';
  analysisContent.innerHTML = '<span class="loading">AI 正在思考中…</span>';

  analyzeBtn.disabled = true;
  analyzeBtn.textContent = '分析中…';

  try {
    // 第 1 步：保存到数据库
    const saveRes = await fetch('/api/mistakes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        time: new Date().toLocaleString('zh-CN'),
        raw_text: rawText,
      }),
    });

    if (!saveRes.ok) {
      const errText = await saveRes.text();
      throw new Error('保存失败(' + saveRes.status + '): ' + errText);
    }

    const saveData = await saveRes.json();
    if (!saveData.id) {
      throw new Error('保存成功但未返回ID');
    }

    // 第 2 步：调 AI 分析
    const analyzeRes = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: saveData.id,
        raw_text: rawText,
      }),
    });

    if (!analyzeRes.ok) {
      const errText = await analyzeRes.text();
      throw new Error('AI分析失败(' + analyzeRes.status + '): ' + errText);
    }

    const analyzeData = await analyzeRes.json();

    // 显示分析结果（兼容新旧格式）
    if (analyzeData.analysis) {
      try {
        const obj = JSON.parse(analyzeData.analysis);
        let html = '';

        const root = obj.root || {};
        const suggestion = obj.suggestion || {};
        const scene = obj.scene || {};
        const actions = obj.actions || [];

        // 兼容旧格式降级
        const surface = root.surface || obj.surfaceCause || '';
        const deep = root.deep || obj.deepCause || '';
        const biases = root.biases || (obj.cognitiveBias ? [obj.cognitiveBias] : []);
        const strategy = suggestion.strategy || (obj.improvementSuggestions || []).join('；') || '';
        const method = suggestion.method || obj.longTermValue || '';
        const actionList = actions.length > 0 ? actions : (obj.actionChecklist || []);
        const typeLabel = obj.type || obj.category || '未分类';

        html += '<div style="margin-bottom:12px"><strong style="color:#7F77DD">错题类型</strong><br>' + escapeHtml(typeLabel) + '</div>';

        if (scene.object || scene.env || scene.pressure) {
          html += '<div style="margin-bottom:12px"><strong style="color:#1D9E75">场景信息</strong><br>';
          if (scene.time) html += '时间：' + escapeHtml(scene.time) + ' ';
          if (scene.period) html += '时段：' + escapeHtml(scene.period) + ' ';
          if (scene.object) html += '对象：' + escapeHtml(scene.object) + ' ';
          if (scene.env) html += '环境：' + escapeHtml(scene.env) + ' ';
          if (scene.pressure) html += '压力：' + escapeHtml(scene.pressure);
          html += '</div>';
        }

        html += '<div style="margin-bottom:12px"><strong style="color:#D85A30">表层原因</strong><br>' + escapeHtml(surface) + '</div>';
        html += '<div style="margin-bottom:12px"><strong style="color:#D85A30">深层原因</strong><br>' + escapeHtml(deep) + '</div>';

        if (biases.length > 0) {
          html += '<div style="margin-bottom:12px"><strong style="color:#BA7517">认知偏误</strong><br>' + biases.map(b => escapeHtml(b)).join('、') + '</div>';
        }

        if (strategy) {
          html += '<div style="margin-bottom:12px"><strong style="color:#1D9E75">改进策略</strong><br>' + escapeHtml(strategy) + '</div>';
        }
        if (method) {
          html += '<div style="margin-bottom:12px"><strong style="color:#1D9E75">可练习方法</strong><br>' + escapeHtml(method) + '</div>';
        }

        if (actionList.length > 0) {
          html += '<div style="margin-bottom:12px"><strong style="color:#378ADD">行动清单</strong><ul style="margin:4px 0 0 16px">';
          actionList.forEach(s => { html += '<li>' + escapeHtml(s) + '</li>'; });
          html += '</ul></div>';
        }

        analysisContent.innerHTML = html;
        status.textContent = '分析完成';
      } catch (e) {
        analysisContent.textContent = analyzeData.analysis;
        status.textContent = '分析完成';
      }
    } else if (analyzeData.error) {
      analysisContent.textContent = 'AI 分析失败：' + analyzeData.error;
      status.textContent = '分析失败';
    } else {
      analysisContent.textContent = 'AI 暂无返回内容';
      status.textContent = '分析完成，但无返回';
    }

    // 显示"再来一条"按钮，隐藏录音区
    document.getElementById('resetBtn').style.display = 'block';
    recordSection.style.display = 'none';
    document.querySelector('.tips-section').style.display = 'none';
    analyzeBtn.style.display = 'none';
    analysisDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (err) {
    console.error('保存/分析失败:', err);
    analysisContent.textContent = '请求失败：' + err.message;
    status.textContent = '请求失败';
  } finally {
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = '开始 AI 分析';
  }
}

// ===== 再来一条：重置所有状态 =====
function resetAll() {
  finalTranscript = '';
  isRecording = false;
  clearInterval(timerInterval);

  analysisDiv.style.display = 'none';
  analysisContent.innerHTML = '';
  status.textContent = '';
  recordStatus.textContent = '';
  transcriptBox.classList.remove('active');
  transcriptBox.innerHTML = '';
  bigRecBtn.classList.remove('recording');
  bigRecBtn.textContent = '🎙';
  recordTimer.classList.remove('active');
  recordTimer.textContent = '00:00';
  analyzeBtn.disabled = true;
  analyzeBtn.style.display = '';

  document.getElementById('resetBtn').style.display = 'none';
  recordSection.style.display = '';
  document.querySelector('.tips-section').style.display = '';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
