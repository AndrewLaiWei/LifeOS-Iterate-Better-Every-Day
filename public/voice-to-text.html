<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点击按钮，记录失误,AI复盘。</title>

<style>
  /* 这里是 CSS，负责让网站变好看 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 整个页面背景 */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

   /* 大标题 */
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #a0a0c0;
    margin-bottom: 40px;
    letter-spacing: 2px;
  }

  /* 录音按钮 */
  #recordBtn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #4a4a6a, #3a3a5a);
    color: #d0d0f0;
    font-size: 48px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 32px rgba(80, 80, 200, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #recordBtn:hover { transform: scale(1.05); }
  #recordBtn:active { transform: scale(0.95); }

  #recordBtn.recording {
    background: linear-gradient(135deg, #cc3344, #aa2244);
    box-shadow: 0 8px 32px rgba(200, 50, 80, 0.4);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(200,50,80,0.4); }
    50% { box-shadow: 0 8px 48px rgba(200,50,80,0.7); }
  }

  /* 状态文字 */
  #status {
    margin-top: 24px;
    font-size: 14px;
    color: #707090;
    min-height: 24px;
  }

  /* 文字结果区 */
  .card {
    margin-top: 32px;
    width: 100%;
    max-width: 600px;
    min-height: 120px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px;
    font-size: 16px;
    line-height: 1.8;
    color: #d0d0e8;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card-label {
    font-size: 13px;
    color: #6060a0;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a2a4a;
  }

  #result:empty::before {
    content: "识别结果将显示在这里…";
    color: #444466;
  }

  /* AI 分析结果区 */
  #analysis {
    background: #1a1a2e;
    border: 1px solid #2a4a3a;
  }

  #analysis-content {
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 加载动画 */
  .loading {
    display: inline-block;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* 计时器 */
  #timer {
    margin-top: 12px;
    font-size: 14px;
    color: #6060a0;
    font-variant-numeric: tabular-nums;
    display: none;
  }
</style>
</head>
<body>

<!-- NAV -->
<nav style="position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,10,0.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);">
  <a href="index.html" style="font-size:16px;font-weight:600;color:#fff;text-decoration:none;">Life<span style="color:#7F77DD;">OS</span></a>
  <div style="display:flex;gap:24px;">
    <a href="index.html" style="font-size:13px;color:rgba(255,255,255,0.6);text-decoration:none;">首页</a>
    <a href="voice-to-text.html" style="font-size:13px;color:rgba(255,255,255,0.9);text-decoration:none;">开始体验</a>
    <a href="prism.html" style="font-size:13px;color:rgba(255,255,255,0.6);text-decoration:none;">复盘棱镜</a>
  </div>
</nav>

<div style="height:72px;"></div>
<h1 style="margin-top:8px;">🎙 语音转文字 · AI 复盘</h1>

<button id="recordBtn" title="点击开始录音">🎙</button>
<div id="timer"></div>
<div id="status">点击按钮开始录音</div>
<div id="result" class="card"></div>
<div id="analysis" class="card" style="display:none">
  <div class="card-label">🤖 AI 分析</div>
  <div id="analysis-content"></div>
</div>

<script>
let isRecording = false;
let recognition = null;
let timerInterval = null;
let seconds = 0;
let finalTranscript = '';

const btn = document.getElementById('recordBtn');
const status = document.getElementById('status');
const result = document.getElementById('result');
const timerEl = document.getElementById('timer');
const analysisDiv = document.getElementById('analysis');
const analysisContent = document.getElementById('analysis-content');

// ===== 检查浏览器支持 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  status.textContent = '❌ 当前浏览器不支持语音识别，请使用 Chrome 或 Edge';
  btn.disabled = true;
}

// ===== 初始化语音识别 =====
function initRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';       // 中文识别
  recognition.interimResults = true;   // 实时显示中间结果
  recognition.continuous = true;      // 持续识别
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    status.textContent = '🎙 正在录音，请说话…';
    timerEl.style.display = 'block';
    startTimer();
  };

  recognition.onresult = (event) => {
    let finalText = finalTranscript;
    let interimText = '';
    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){
      const text = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalText += text;
        finalTranscript += text;
      } else {
        interimText += text;
      }
    }
    // 显示：最终结果 + 灰色中间结果
    result.innerHTML = escapeHtml(finalText) +
      (interimText ? `<span style="color:#555577">${escapeHtml(interimText)}</span>` : '');
  };

  recognition.onerror = (event) => {
    console.error('语音识别错误:', event.error);
    if (event.error === 'not-allowed') {
      status.textContent = '❌ 请允许浏览器使用麦克风权限';
    } else if (event.error === 'no-speech') {
      status.textContent = '🎙 未检测到语音，请继续说话…';
    } else if (event.error === 'network') {
      status.textContent = '❌ 网络错误，请检查网络连接';
    } else {
      status.textContent = '⚠️ 识别错误：' + event.error;
    }
  };

recognition.onend = async () => {

  if (isRecording) {

    setTimeout(() => {

      try {
        recognition.start();
      } catch (e) {
        console.warn(e);
      }

    }, 500);

    return;
  }

  result.textContent = finalTranscript;

  if (pendingAnalyze) {

    pendingAnalyze = false;

    if (finalTranscript.trim()) {

      await saveAndAnalyze(
        finalTranscript
      );

    } else {

      status.textContent =
        '⚠️ 没有识别到文字';
    }
  }
};

function startTimer() {
  seconds = 0;
  updateTimer();
  timerInterval = setInterval(() => { seconds++; updateTimer(); }, 1000);
}

function updateTimer() {
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  timerEl.textContent = m + ':' + s;
}

function stopTimer() {
  clearInterval(timerInterval);
  timerEl.style.display = 'none';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 按钮点击 =====
btn.addEventListener('click', () => {
  if (!isRecording) {
    startRecording();
  } else {
    stopRecording();
  }
});

function startRecording() {
  if (!recognition) initRecognition();

  isRecording = true;
  btn.classList.add('recording');
  btn.textContent = '⏹';
  result.textContent = '';
  finalTranscript = '';
  analysisDiv.style.display = 'none';

  try {
    recognition.start();
  } catch(e) {
    console.warn('recognition.start() 异常:', e);
  }
}

function stopRecording() {
  isRecording = false;
  btn.classList.remove('recording');
  btn.textContent = '🎙';
  stopTimer();

  if (finalTranscript) {
    result.textContent = finalTranscript;
    // 自动保存 + AI 分析
    saveAndAnalyze(finalTranscript);
  } else {
    status.textContent = '⚠️ 没有识别到文字';
  }

  try { recognition.stop(); } catch(e) {}
}

// ===== 自动保存到服务器 + 调 AI 分析 =====
async function saveAndAnalyze(text) {
  status.textContent = '⏳ 正在保存并发送给 AI 分析…';
  analysisDiv.style.display = 'block';
  analysisContent.innerHTML = '<span class="loading">🤖 AI 正在思考中…</span>';

  try {
    // 第 1 步：保存错题到数据库
    const saveRes = await fetch('/api/mistakes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        time: new Date().toLocaleString('zh-CN'),
        raw_text: text,
      }),
    });
   if (!saveRes.ok) {

  throw new Error(
    `保存失败: ${saveRes.status}`
  );
}

const saveData =
  await saveRes.json();

    // 第 2 步：调 AI 分析
    const analyzeRes = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: saveData.id,
        raw_text: text,
      }),
    });
    const analyzeData = await analyzeRes.json();

    // 显示分析结果
    if (analyzeData.analysis) {
      analysisContent.textContent = analyzeData.analysis;
      status.textContent = '✅ 分析完成！';
    } else {
      analysisContent.textContent = '⚠️ AI 暂无返回内容';
      status.textContent = '⚠️ 分析完成，但无返回';
    }
  } catch (err) {
    console.error('保存/分析失败:', err);
    analysisContent.textContent = '❌ 请求失败，请检查服务器是否启动';
    status.textContent = '❌ 请求失败';
  }
}
</script>

</body>
</html>
