<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点击按钮，记录失误,AI复盘。</title>

<style>
  /* 这里是 CSS，负责让网站变好看 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 整个页面背景 */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

   /* 大标题 */
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #a0a0c0;
    margin-bottom: 40px;
    letter-spacing: 2px;
  }

  /* 录音按钮（主录音和引导问题共用） */
  .record-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #4a4a6a, #3a3a5a);
    color: #d0d0f0;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 16px rgba(80, 80, 200, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .record-btn:hover { transform: scale(1.08); }
  .record-btn:active { transform: scale(0.95); }
  .record-btn.recording {
    background: linear-gradient(135deg, #cc3344, #aa2244);
    box-shadow: 0 4px 20px rgba(200, 50, 80, 0.5);
    animation: pulse-sm 1.2s infinite;
  }

  /* 主录音大按钮 */
  #recordBtn {
    width: 120px;
    height: 120px;
    font-size: 48px;
    box-shadow: 0 8px 32px rgba(80, 80, 200, 0.2);
  }
  #recordBtn.recording {
    box-shadow: 0 8px 32px rgba(200, 50, 80, 0.4);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(200,50,80,0.4); }
    50% { box-shadow: 0 8px 48px rgba(200,50,80,0.7); }
  }
  @keyframes pulse-sm {
    0%, 100% { box-shadow: 0 4px 20px rgba(200,50,80,0.5); }
    50% { box-shadow: 0 4px 32px rgba(200,50,80,0.8); }
  }

  /* 状态文字 */
  #status {
    margin-top: 24px;
    font-size: 14px;
    color: #707090;
    min-height: 24px;
  }

  /* 文字结果区 */
  .card {
    margin-top: 32px;
    width: 100%;
    max-width: 600px;
    min-height: 120px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px;
    font-size: 16px;
    line-height: 1.8;
    color: #d0d0e8;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card-label {
    font-size: 13px;
    color: #6060a0;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a2a4a;
  }

  #result:empty::before {
    content: "识别结果将显示在这里…";
    color: #444466;
  }

  /* AI 分析结果区 */
  #analysis {
    background: #1a1a2e;
    border: 1px solid #2a4a3a;
  }

  #analysis-content {
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 加载动画 */
  .loading {
    display: inline-block;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* 计时器 */
  #timer {
    margin-top: 12px;
    font-size: 14px;
    color: #6060a0;
    font-variant-numeric: tabular-nums;
    display: none;
  }

  /* ====== 引导式补充录音区域 ====== */
  #guidePanel {
    margin-top: 32px;
    width: 100%;
    max-width: 600px;
    display: none;
  }

  #guidePanel h2 {
    font-size: 16px;
    color: #8080b0;
    margin-bottom: 16px;
    font-weight: 600;
  }

  .guide-hint {
    font-size: 13px;
    color: #505070;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .guide-question {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    transition: border-color 0.3s;
  }

  .guide-question.answered {
    border-color: #2a5a3a;
  }

  .guide-question-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .guide-question-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #2a2a4a;
    color: #8080b0;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .guide-question-text {
    font-size: 14px;
    color: #a0a0c0;
    flex: 1;
  }

  .guide-question-body {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .guide-answer {
    flex: 1;
    min-height: 40px;
    font-size: 14px;
    color: #505070;
    line-height: 1.6;
    padding: 8px 0;
    word-break: break-word;
  }

  .guide-answer.has-text {
    color: #b0b0d0;
  }

  .guide-skip-btn {
    font-size: 12px;
    color: #505070;
    cursor: pointer;
    padding: 4px 10px;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    background: transparent;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .guide-skip-btn:hover {
    color: #8080a0;
    border-color: #3a3a5a;
  }
  .guide-skip-btn.skipped {
    color: #505060;
    text-decoration: line-through;
  }

  /* 开始分析大按钮 */
  #analyzeBtn {
    margin-top: 24px;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #3a6a4a, #2a5a3a);
    color: #d0f0d0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  #analyzeBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(60,140,80,0.3); }
  #analyzeBtn:active { transform: translateY(0); }
  #analyzeBtn:disabled {
    background: #2a2a3a;
    color: #505060;
    cursor: not-allowed;
    box-shadow: none;
  }
</style>
</head>
<body>

<h1>🎙 语音转文字 · AI 复盘</h1>

<button id="recordBtn" title="点击开始录音">🎙</button>
<div id="timer"></div>
<div id="status">点击按钮开始录音</div>
<div id="result" class="card"></div>

<!-- 引导式补充录音面板（录音完成后显示） -->
<div id="guidePanel">
  <h2>📝 为了更精准的分析，请补充以下信息</h2>
  <div class="guide-hint">每个问题都可以用录音回答或点击「跳过」。回答得越详细，AI 分析越精准。</div>

  <div class="guide-question" id="q1" data-key="event">
    <div class="guide-question-header">
      <div class="guide-question-num">1</div>
      <div class="guide-question-text">发生了什么事？</div>
    </div>
    <div class="guide-question-body">
      <div class="guide-answer" id="answer-event">点击 🎙 录音回答</div>
      <button class="record-btn guide-rec-btn" data-key="event" title="录音">🎙</button>
      <button class="guide-skip-btn" onclick="skipQuestion('event')">跳过</button>
    </div>
  </div>

  <div class="guide-question" id="q2" data-key="action">
    <div class="guide-question-header">
      <div class="guide-question-num">2</div>
      <div class="guide-question-text">当时做了什么？</div>
    </div>
    <div class="guide-question-body">
      <div class="guide-answer" id="answer-action">点击 🎙 录音回答</div>
      <button class="record-btn guide-rec-btn" data-key="action" title="录音">🎙</button>
      <button class="guide-skip-btn" onclick="skipQuestion('action')">跳过</button>
    </div>
  </div>

  <div class="guide-question" id="q3" data-key="thought">
    <div class="guide-question-header">
      <div class="guide-question-num">3</div>
      <div class="guide-question-text">你当时是怎么想的？</div>
    </div>
    <div class="guide-question-body">
      <div class="guide-answer" id="answer-thought">点击 🎙 录音回答</div>
      <button class="record-btn guide-rec-btn" data-key="thought" title="录音">🎙</button>
      <button class="guide-skip-btn" onclick="skipQuestion('thought')">跳过</button>
    </div>
  </div>

  <div class="guide-question" id="q4" data-key="consequence">
    <div class="guide-question-header">
      <div class="guide-question-num">4</div>
      <div class="guide-question-text">导致了什么后果？</div>
    </div>
    <div class="guide-question-body">
      <div class="guide-answer" id="answer-consequence">点击 🎙 录音回答</div>
      <button class="record-btn guide-rec-btn" data-key="consequence" title="录音">🎙</button>
      <button class="guide-skip-btn" onclick="skipQuestion('consequence')">跳过</button>
    </div>
  </div>

  <div class="guide-question" id="q5" data-key="plan">
    <div class="guide-question-header">
      <div class="guide-question-num">5</div>
      <div class="guide-question-text">以后打算怎么做？</div>
    </div>
    <div class="guide-question-body">
      <div class="guide-answer" id="answer-plan">点击 🎙 录音回答</div>
      <button class="record-btn guide-rec-btn" data-key="plan" title="录音">🎙</button>
      <button class="guide-skip-btn" onclick="skipQuestion('plan')">跳过</button>
    </div>
  </div>

  <button id="analyzeBtn" onclick="submitForAnalysis()">🚀 完成补充，开始 AI 分析</button>
</div>

<div id="analysis" class="card" style="display:none">
  <div class="card-label">🤖 AI 分析</div>
  <div id="analysis-content"></div>
</div>

<script>
// ===== 全局状态 =====
let isRecording = false;
let recordingTarget = 'main'; // 'main' = 主录音, 'event'/'action'/... = 引导问题录音
let recognition = null;
let timerInterval = null;
let seconds = 0;
let finalTranscript = '';
let mainText = '';          // 主录音最终文字
let guideAnswers = {};     // 引导问题的回答 { event: '...', action: '...', ... }
let guideSkipped = {};      // 记录哪些问题被跳过了

const btn = document.getElementById('recordBtn');
const status = document.getElementById('status');
const result = document.getElementById('result');
const timerEl = document.getElementById('timer');
const analysisDiv = document.getElementById('analysis');
const analysisContent = document.getElementById('analysis-content');
const guidePanel = document.getElementById('guidePanel');

// ===== 检查浏览器支持 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  status.textContent = '❌ 当前浏览器不支持语音识别，请使用 Chrome 或 Edge';
  btn.disabled = true;
}

// ===== 初始化语音识别 =====
function initRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    if (recordingTarget === 'main') {
      status.textContent = '🎙 正在录音，请说话…';
      timerEl.style.display = 'block';
      startTimer();
    } else {
      // 引导问题录音：更新对应问题的状态
      const answerEl = document.getElementById('answer-' + recordingTarget);
      answerEl.textContent = '🎙 正在录音…';
      answerEl.classList.add('has-text');
      answerEl.style.color = '#cc5566';
    }
  };

  recognition.onresult = (event) => {
    let interimText = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += text;
      } else {
        interimText += text;
      }
    }

    if (recordingTarget === 'main') {
      // 主录音：显示在 result 区域
      result.innerHTML = escapeHtml(finalTranscript) +
        (interimText ? '<span style="color:#555577">' + escapeHtml(interimText) + '</span>' : '');
    } else {
      // 引导问题录音：显示在对应问题的回答区
      const answerEl = document.getElementById('answer-' + recordingTarget);
      answerEl.innerHTML = escapeHtml(finalTranscript) +
        (interimText ? '<span style="color:#555577">' + escapeHtml(interimText) + '</span>' : '');
      answerEl.style.color = '#b0b0d0';
    }
  };

  recognition.onerror = (event) => {
    console.error('语音识别错误:', event.error);
    if (event.error === 'not-allowed') {
      if (recordingTarget === 'main') {
        status.textContent = '❌ 请允许浏览器使用麦克风权限';
      }
    } else if (event.error === 'no-speech') {
      // 不显示错误，静默处理
    } else if (event.error === 'network') {
      if (recordingTarget === 'main') {
        status.textContent = '❌ 网络错误，请检查网络连接';
      }
    }
  };

  recognition.onend = () => {
    if (!isRecording) {
      // 停止录音后的处理
      const text = finalTranscript.trim();

      if (recordingTarget === 'main') {
        // 主录音结束 → 显示引导问题面板
        if (text) {
          result.textContent = text;
          mainText = text;
          showGuidePanel();
        } else {
          status.textContent = '⚠️ 没有识别到文字';
        }
      } else {
        // 引导问题录音结束 → 保存答案
        if (text) {
          guideAnswers[recordingTarget] = text;
          const answerEl = document.getElementById('answer-' + recordingTarget);
          answerEl.textContent = text;
          answerEl.classList.add('has-text');
          // 标记为已回答
          document.getElementById('q' + getQuestionNum(recordingTarget)).classList.add('answered');
        }
        // 恢复按钮状态
        resetGuideBtn(recordingTarget);
      }
    } else {
      // 录音中自动断开，重新启动
      try { recognition.start(); } catch(e) {}
    }
  };
}

// 根据问题 key 获取序号
function getQuestionNum(key) {
  const map = { event: 1, action: 2, thought: 3, consequence: 4, plan: 5 };
  return map[key] || 1;
}

// 显示引导问题面板
function showGuidePanel() {
  status.textContent = '✅ 语音已记录！请补充以下信息（可跳过）';
  guidePanel.style.display = 'block';
  // 滚动到引导面板
  setTimeout(() => {
    guidePanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 200);
}

// 跳过某个问题
function skipQuestion(key) {
  guideSkipped[key] = true;
  const answerEl = document.getElementById('answer-' + key);
  answerEl.textContent = '已跳过';
  answerEl.style.color = '#404050';
  const skipBtn = answerEl.nextElementSibling.nextElementSibling;
  if (skipBtn) {
    skipBtn.classList.add('skipped');
    skipBtn.textContent = '已跳过';
  }
}

// 重置引导问题录音按钮
function resetGuideBtn(key) {
  const questionEl = document.getElementById('q' + getQuestionNum(key));
  const recBtn = questionEl.querySelector('.guide-rec-btn');
  recBtn.classList.remove('recording');
  recBtn.textContent = '🎙';
}

function startTimer() {
  seconds = 0;
  updateTimer();
  timerInterval = setInterval(() => { seconds++; updateTimer(); }, 1000);
}

function updateTimer() {
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  timerEl.textContent = m + ':' + s;
}

function stopTimer() {
  clearInterval(timerInterval);
  timerEl.style.display = 'none';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 主录音按钮点击 =====
btn.addEventListener('click', () => {
  if (!isRecording) {
    startMainRecording();
  } else {
    stopRecording();
  }
});

function startMainRecording() {
  if (!recognition) initRecognition();

  isRecording = true;
  recordingTarget = 'main';
  btn.classList.add('recording');
  btn.textContent = '⏹';
  result.textContent = '';
  finalTranscript = '';
  mainText = '';
  guideAnswers = {};
  guideSkipped = {};
  analysisDiv.style.display = 'none';
  guidePanel.style.display = 'none';

  // 重置所有引导问题状态
  document.querySelectorAll('.guide-question').forEach(q => q.classList.remove('answered'));
  document.querySelectorAll('.guide-answer').forEach(a => {
    a.textContent = '点击 🎙 录音回答';
    a.classList.remove('has-text');
    a.style.color = '';
  });
  document.querySelectorAll('.guide-skip-btn').forEach(s => {
    s.classList.remove('skipped');
    s.textContent = '跳过';
  });

  try {
    recognition.start();
  } catch(e) {
    console.warn('recognition.start() 异常:', e);
  }
}

function stopRecording() {
  isRecording = false;
  btn.classList.remove('recording');
  btn.textContent = '🎙';
  stopTimer();
  try { recognition.stop(); } catch(e) {}
}

// ===== 引导问题录音按钮点击 =====
document.querySelectorAll('.guide-rec-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.getAttribute('data-key');

    if (btn.classList.contains('recording')) {
      // 正在录音 → 停止
      isRecording = false;
      btn.classList.remove('recording');
      btn.textContent = '🎙';
      try { recognition.stop(); } catch(e) {}
    } else {
      // 先停掉其他正在录音的按钮
      document.querySelectorAll('.guide-rec-btn.recording').forEach(otherBtn => {
        otherBtn.classList.remove('recording');
        otherBtn.textContent = '🎙';
      });

      // 开始录音这个问题的回答
      if (!recognition) initRecognition();

      isRecording = true;
      recordingTarget = key;
      btn.classList.add('recording');
      btn.textContent = '⏹';
      finalTranscript = '';

      // 取消跳过状态
      delete guideSkipped[key];
      const answerEl = document.getElementById('answer-' + key);
      answerEl.textContent = '🎙 点击开始说话…';
      answerEl.style.color = '#cc5566';
      const skipBtn = answerEl.nextElementSibling.nextElementSibling;
      if (skipBtn) {
        skipBtn.classList.remove('skipped');
        skipBtn.textContent = '跳过';
      }

      try {
        recognition.start();
      } catch(e) {
        console.warn('recognition.start() 异常:', e);
      }
    }
  });
});

// ===== 完成补充，开始 AI 分析 =====
async function submitForAnalysis() {
  status.textContent = '⏳ 正在保存并发送给 AI 分析…';
  analysisDiv.style.display = 'block';
  analysisContent.innerHTML = '<span class="loading">🤖 AI 正在思考中…</span>';

  // 禁用分析按钮
  const analyzeBtn = document.getElementById('analyzeBtn');
  analyzeBtn.disabled = true;
  analyzeBtn.textContent = '⏳ 分析中…';

  try {
    // 第 1 步：保存错题到数据库（包含结构化回答）
    const saveRes = await fetch('/api/mistakes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        time: new Date().toLocaleString('zh-CN'),
        raw_text: mainText,
        structured: JSON.stringify(guideAnswers),
      }),
    });

    if (!saveRes.ok) {
      const errText = await saveRes.text();
      throw new Error('保存失败(' + saveRes.status + '): ' + errText);
    }

    const saveData = await saveRes.json();
    if (!saveData.id) {
      throw new Error('保存成功但未返回ID');
    }

    // 第 2 步：调 AI 分析（传入结构化回答）
    const analyzeRes = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: saveData.id,
        raw_text: mainText,
        answers: guideAnswers,
      }),
    });

    if (!analyzeRes.ok) {
      const errText = await analyzeRes.text();
      throw new Error('AI分析失败(' + analyzeRes.status + '): ' + errText);
    }

    const analyzeData = await analyzeRes.json();

    // 显示分析结果
    if (analyzeData.analysis) {
      try {
        const analysisObj = JSON.parse(analyzeData.analysis);
        let html = '';
        html += '<div style="margin-bottom:12px"><strong>📌 事件记录</strong><br>' + escapeHtml(analysisObj.eventRecord || '') + '</div>';
        html += '<div style="margin-bottom:12px"><strong>🔍 表面原因</strong><br>' + escapeHtml(analysisObj.surfaceCause || '') + '</div>';
        html += '<div style="margin-bottom:12px"><strong>🧠 行为分析</strong><br>' + escapeHtml(analysisObj.behavioralAnalysis || '') + '</div>';
        html += '<div style="margin-bottom:12px"><strong>💡 深层原因</strong><br>' + escapeHtml(analysisObj.deepCause || '') + '</div>';
        html += '<div style="margin-bottom:12px"><strong>⚠️ 认知偏差</strong><br>' + escapeHtml(analysisObj.cognitiveBias || '') + '</div>';
        html += '<div style="margin-bottom:12px"><strong>✅ 改进建议</strong><ul style="margin:4px 0 0 16px">';
        (analysisObj.improvementSuggestions || []).forEach(s => { html += '<li>' + escapeHtml(s) + '</li>'; });
        html += '</ul></div>';
        html += '<div style="margin-bottom:12px"><strong>📋 行动清单</strong><ul style="margin:4px 0 0 16px">';
        (analysisObj.actionChecklist || []).forEach(s => { html += '<li>' + escapeHtml(s) + '</li>'; });
        html += '</ul></div>';
        html += '<div><strong>🎯 长期价值</strong><br>' + escapeHtml(analysisObj.longTermValue || '') + '</div>';
        analysisContent.innerHTML = html;
        status.textContent = '✅ 分析完成！';
      } catch (e) {
        analysisContent.textContent = analyzeData.analysis;
        status.textContent = '✅ 分析完成！';
      }
    } else if (analyzeData.error) {
      analysisContent.textContent = '❌ AI 分析失败：' + analyzeData.error;
      status.textContent = '❌ 分析失败';
    } else {
      analysisContent.textContent = '⚠️ AI 暂无返回内容';
      status.textContent = '⚠️ 分析完成，但无返回';
    }
  } catch (err) {
    console.error('保存/分析失败:', err);
    analysisContent.textContent = '❌ 请求失败：' + err.message;
    status.textContent = '❌ 请求失败';
  } finally {
    // 恢复分析按钮
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = '🚀 完成补充，开始 AI 分析';
  }
}
</script>

</body>
</html>
